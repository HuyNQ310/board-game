services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meo-no-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/meo-no.sqlite
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - DISCONNECT_GRACE_MS=${DISCONNECT_GRACE_MS:-120000}
    volumes:
      - meo_no_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  meo_no_data:
